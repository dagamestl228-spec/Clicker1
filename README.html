<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клікер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #counter {
            font-size: 4rem;
            font-weight: bold;
            color: #e94560;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        #coin-btn {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid #c73659;
            background: #e94560;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.1s, box-shadow 0.1s;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #coin-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(233, 69, 96, 0.6);
        }

        #coin-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.3);
        }

        #coin-btn.cooldown {
            filter: brightness(0.7);
            cursor: not-allowed;
        }

        #coin-btn img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
        }

        .plus-one {
            position: absolute;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.3);
            }
        }
    </style>
</head>
<body>
    <div id="counter">0</div>
    <button id="coin-btn">
        <img src="https://cdn-icons-png.flaticon.com/512/3119/3119229.png" alt="Монетка">
    </button>

    <script>
        let count = 0;
        let lastClickTime = 0;
        const COOLDOWN = 20;

        const counter = document.getElementById('counter');
        const btn = document.getElementById('coin-btn');

        btn.addEventListener('click', (e) => {
            const now = Date.now();

            if (now - lastClickTime < COOLDOWN) {
                return;
            }

            lastClickTime = now;

            btn.classList.add('cooldown');
            setTimeout(() => {
                btn.classList.remove('cooldown');
            }, COOLDOWN);

            count++;
            counter.innerText = count;

            const plus = document.createElement('span');
            plus.className = 'plus-one';
            plus.innerText = '+1';

            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            plus.style.left = x + 'px';
            plus.style.top = y + 'px';

            btn.appendChild(plus);
            setTimeout(() => plus.remove(), 800);
        });
    </script>
</body>
</html>
